name: 功能建议
description: 提一个新功能或改进建议（新端点 / 新模型支持 / 打包改进…）
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景问题
      description: 你想解决什么问题？没有这个功能时现在怎么绕？
      placeholder: |
        例：批量预测 1000 个分子要发 1000 次请求，现在脚本里串行循环，慢且易超时。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你期望的接口 / 行为 / 配置长什么样
      placeholder: |
        例：POST /api/predict/batch 接受 smiles 数组，返回任务 id 轮询结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法，以及为什么更差
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: 影响组件
      options:
        - web API
        - 模型服务
        - 桌面打包工具链
        - core 包（vendored 内核）
        - 脚本 / 工具
        - 部署
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 是否需要动参考环境
      description: 动 core/environment.yml 的建议要说明对既有部署的影响
      options:
        - 不需要改环境
        - 需要加 / 改依赖（请说明）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 附加材料
      description: 参考实现、论文 / 文档链接、相关 issue
    validations:
      required: false
