# RetroChimera Windows 环境记录（实测可行版本组合）
#
# ⚠️ 重要：不要用 conda 通道安装 pytorch！
#    conda 的 pytorch 2.2.2 win-64 构建与 conda-forge 的新版 intel-openmp 冲突，
#    运行时会报 fbgemm.dll 加载失败（WinError 182）。
#    必须使用 pip 官方 wheel（自带完整 DLL，实测 GPU 可用）。
#
# 本文件仅作版本记录，不含 conda dependencies 段，请按下述命令手动执行。

name: retrochimera

# ---- 步骤 1：创建环境 ----
#   conda create -n retrochimera python=3.9.7 -y
#   conda activate retrochimera

# ---- 步骤 2：PyTorch（必须 pip，不能用 conda）----
#   python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cu121

# ---- 步骤 3：numpy 必须降到 1.x（torch 2.2.2 是 numpy1.x 编译的）----
#   python -m pip install "numpy==1.26.4"
#   验证：python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#   期望：2.2.2+cu121 True

# ---- 步骤 4：PyTorch Geometric（wheel 源目录名是 torch-2.2.0+cu121，不要写 2.2.2）----
#   python -m pip install torch-geometric==2.5.2
#   python -m pip install torch-scatter torch-sparse torch-cluster -f https://data.pyg.org/whl/torch-2.2.0+cu121.html

# ---- 步骤 5：化学与通用依赖 ----
#   python -m pip install rdkit==2023.9.6 rdchiral pandas scipy h5py omegaconf
#   python -m pip install antlr4-python3-runtime tqdm joblib more-itertools pebble wandb pyyaml
#   注：官方 environment.yml 里的 rdchiral_cpp 只有 Linux 版且仅训练需要，推理用纯 Python 的 rdchiral 即可

# ---- 步骤 6：syntheseus 与 RetroChimera 本体 ----
#   python -m pip install "syntheseus==0.8.0" "syntheseus-graphium==0.1.0"
#   cd /d F:\retrochimera\core
#   python -m pip install -e .

# ---- 步骤 7：API 服务 ----
#   python -m pip install flask

# ---- 验证 ----
#   cd /d F:\retrochimera
#   python scripts\check_install.py models\retrochimera_pistachio 3

